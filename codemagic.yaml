workflows:
  jarvis-workflow:
    name: Jarvis Build
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Criar estrutura do projeto
        script: |
          flutter create --platforms=android --project-name jarvis .
          ls -la
      - name: Instalar pacotes
        script: |
          flutter pub get
      - name: Construir APK
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
